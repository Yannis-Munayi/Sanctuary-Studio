<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Worship Output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    .layer { position: absolute; inset: 0; transition: opacity var(--fade, 300ms) ease; }
    .layer > * { position: absolute; inset: 0; width: 100%; height: 100%; }
    .fade { opacity: 0; }
    video, img { object-fit: cover; }
    .contain { object-fit: contain; }
    .stretch { object-fit: fill; }
    #black { background: #000; opacity: 0; pointer-events: none; }
    #logo { opacity: 0; background: #000; }
    #logo img { object-fit: contain; }
  </style>
</head>
<body>
  <div id="bg" class="layer"></div>
  <div id="media" class="layer"></div>
  <div id="text" class="layer"></div>
  <div id="logo" class="layer"></div>
  <div id="black" class="layer"></div>
  <script type="module" src="js/output.js"></script>
</body>
</html>
